[project]
name = "notion-markdown-extractor"
version = "0.1.0"
description = "Extract Notion pages to Markdown files with local image downloads"
readme = "README.md"
authors = [
    { name = "DAESA24", email = "173488786+DAESA24@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.0",
    "notion-client>=2.5.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
notion-md = "notion_markdown_extractor:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
